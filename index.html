<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Schichtplan Technikteam</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  /* Layout: Kopfzeile mit Einstellungen, darunter Reiter und ein breites, scrollbares Planraster */
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --line: #e2dfd6; --text: #1f1e1b; --muted: #6d6a62;
    --accent: #2f5fd0; --err: #c0392b; --warn: #b7791f; --info: #4a6785; --ok: #2d7a46;
    --weekend: #f0eee6; --holiday: #f6e3df; --group: #ebe9e1; --hatch: #e2dfd4; --strong: #b9b5a8; --chip: #1f1e1b;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #17181b; --panel: #202226; --line: #34373d; --text: #e9e7e1; --muted: #a09d95;
    --accent: #7ea2f5; --err: #f08a7c; --warn: #e0b060; --info: #9bb6d4; --ok: #7cc795;
    --weekend: #292b30; --holiday: #40302f; --group: #2c2e33; --hatch: #3a3d44; --strong: #5a5e66; --chip: #1f1e1b; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #17181b; --panel: #202226; --line: #34373d; --text: #e9e7e1; --muted: #a09d95;
    --accent: #7ea2f5; --err: #f08a7c; --warn: #e0b060; --info: #9bb6d4; --ok: #7cc795;
    --weekend: #292b30; --holiday: #40302f; --group: #2c2e33; --hatch: #3a3d44; --strong: #5a5e66; --chip: #1f1e1b; color-scheme: dark }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: end; padding-block: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); background: var(--panel); border-bottom: 1px solid var(--line); }
  header h1 { font-size: 18px; margin: 0 12px 0 0; }
  label { display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
  input, select, button { font: inherit; color: inherit; }
  input, select { padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); }
  button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--panel); cursor: pointer; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  button.link { border: 0; background: none; color: var(--err); padding: 2px 4px; }
  nav { display: flex; gap: 4px; padding-top: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); flex-wrap: wrap; }
  nav button { border-bottom-left-radius: 0; border-bottom-right-radius: 0; border-bottom: 0; background: transparent; }
  nav button.on { background: var(--panel); font-weight: 600; }
  main { padding-bottom: 32px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 0 8px 8px 8px; padding: 14px; }
  .summary { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .pill { padding: 3px 10px; border-radius: 999px; font-size: 12px; border: 1px solid var(--line); }
  .pill.error { color: var(--err); border-color: var(--err); } .pill.warn { color: var(--warn); border-color: var(--warn); }
  .pill.info { color: var(--info); } .pill.ok { color: var(--ok); border-color: var(--ok); }
  .gridwrap { overflow: auto; max-height: 70vh; border: 1px solid var(--line); border-radius: 6px; }
  table.grid { border-collapse: separate; border-spacing: 0; }
  table.grid th, table.grid td { border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); padding: 2px; text-align: center; min-width: 46px; height: 30px; background: var(--panel); }
  table.grid thead th { position: sticky; top: 0; z-index: 2; font-size: 11px; font-weight: 500; color: var(--muted); }
  table.grid thead tr:nth-child(2) th { top: 22px; }
  table.grid th.name { position: sticky; left: 0; z-index: 3; text-align: left; min-width: 150px; padding: 2px 8px; font-weight: 500; color: var(--text); white-space: nowrap; }
  table.grid thead th.name { z-index: 4; }
  table.grid .we { background: var(--weekend); }
  table.grid .hol { background: var(--holiday); }
  .swatch { display: inline-block; width: 12px; height: 12px; background: var(--holiday); border: 1px solid var(--line); vertical-align: -1px; }
  table.grid .monthstart { border-left: 2px solid var(--strong); }
  table.grid tr.group th { text-align: left; background: var(--group); font-size: 11px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); position: sticky; left: 0; }
  td.cell { cursor: pointer; }
  td.cell:hover { outline: 2px solid var(--accent); outline-offset: -2px; }
  td.bad { box-shadow: inset 0 0 0 2px var(--err); }
  td.off { background: repeating-linear-gradient(135deg, var(--panel), var(--panel) 4px, var(--hatch) 4px, var(--hatch) 8px) !important; }
  td.wish { background-image: radial-gradient(circle at 85% 20%, var(--warn) 2px, transparent 3px); }
  .chip { display: inline-block; min-width: 38px; padding: 2px 4px; border-radius: 5px; font-size: 11px; font-weight: 600; border: 1.5px solid; color: var(--chip); }
  tr.group td { background: var(--group) !important; }
  .absmark { font-size: 11px; font-weight: 700; color: var(--muted); }
  td.prop { box-shadow: inset 0 0 0 2px var(--accent); }
  .proposal { border: 2px solid var(--accent); border-radius: 8px; padding: 10px 12px; margin-bottom: 12px; }
  .proposal ul { margin: 6px 0 10px; padding-left: 18px; }
  .proposal .open { color: var(--err); }
  .proposal .row { display: flex; gap: 8px; flex-wrap: wrap; }
  .s-FRUEH { background: #fdf3cf; border-color: #e6b100; } .s-TAG { background: #dff3e6; border-color: #1f8f55; }
  .s-SP1 { background: #e4e6fa; border-color: #4a4fb5; } .s-SP2 { background: #dff1f7; border-color: #1b93b8; }
  .s-NS { background: #efe6f8; border-color: #7a3fa8; } .s-T_HG { background: #ecf6d9; border-color: #8bbd2f; }
  .s-T_LILA { background: #fbe3f1; border-color: #c2187a; }
  tr.status td { font-size: 12px; } .st-error { color: var(--err); font-weight: 700; } .st-ok { color: var(--ok); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 10px 0; font-size: 12px; color: var(--muted); }
  ul.warnings { list-style: none; margin: 10px 0 0; padding: 0; max-height: 260px; overflow: auto; }
  ul.warnings li { padding: 4px 0; border-bottom: 1px solid var(--line); }
  .lv { display: inline-block; width: 68px; font-size: 11px; font-weight: 700; text-transform: uppercase; }
  .lv.error { color: var(--err); } .lv.warn { color: var(--warn); } .lv.info { color: var(--info); }
  table.plain { border-collapse: collapse; width: 100%; }
  table.plain th, table.plain td { border-bottom: 1px solid var(--line); padding: 6px 8px; text-align: left; vertical-align: middle; }
  table.plain th { font-size: 12px; color: var(--muted); font-weight: 500; }
  .scroll { overflow-x: auto; }
  td.neg { color: var(--err); font-weight: 600; }
  h3 { font-size: 14px; margin: 22px 0 6px; }
  table.plain td { font-variant-numeric: tabular-nums; }
  .form { display: flex; flex-wrap: wrap; gap: 10px; align-items: end; margin-bottom: 14px; }
  .days label { flex-direction: row; display: inline-flex; gap: 2px; margin-right: 6px; align-items: center; }
  #pop { position: absolute; z-index: 10; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.15); display: none; width: 220px; }
  #pop .t { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
  #pop .b { display: flex; flex-wrap: wrap; gap: 5px; }
  #pop button { padding: 3px 6px; font-size: 12px; }
  .hint { color: var(--muted); font-size: 12px; margin: 0 0 10px; }
</style>
</head>
<body>
<header>
  <h1>Schichtplan</h1>
  <label>Beginn (Montag)<input type="date" id="start"></label>
  <label>Wochen<input type="number" id="weeks" min="1" max="26" style="width:70px"></label>
  <button class="primary" id="refresh">Aktualisieren</button>
  <button id="variant">Neuen Plan berechnen</button>
  <button id="reset">Beispieldaten laden</button>
</header>
<nav id="tabs"></nav>
<main><div class="panel" id="view"></div></main>
<div id="pop"></div>

<script id="planner">
/* Planlogik. Läuft im Browser und (für Tests) in Node. */
const Planner = (() => {
  const SHIFTS = {
    FRUEH:  { label: 'Früh', time: '05:30–14:00', idx: 0 },
    TAG:    { label: 'Tag',  time: '08:00–16:30', idx: 1 },
    SP1:    { label: 'SP1',  time: '10:45–19:15', idx: 2 },
    SP2:    { label: 'SP2',  time: '13:30–22:00', idx: 3 },
    NS:     { label: 'NS',   time: '22:00–05:30', idx: 4 },
    T_HG:   { label: 'T',    time: '09:00–15:00', idx: 1, fixedOnly: true },
    T_LILA: { label: 'T',    time: '08:00–12:00', idx: 1, fixedOnly: true },
  };
  const ROT = ['FRUEH', 'TAG', 'SP1', 'SP2', 'NS'];   // Reihenfolge = erlaubte Wechselrichtung
  const WE = ['FRUEH', 'SP2', 'NS'];                  // Wochenendschichten
  const DOW = ['Mo', 'Di', 'Mi', 'Do', 'Fr', 'Sa', 'So'];

  const toDate = s => new Date(s + 'T00:00:00Z');
  const fmt = d => d.toISOString().slice(0, 10);
  const addDays = (s, n) => { const d = toDate(s); d.setUTCDate(d.getUTCDate() + n); return fmt(d); };
  const dow = s => (toDate(s).getUTCDay() + 6) % 7;   // 0 = Montag
  const nextMonday = from => { let s = fmt(from); do { s = addDays(s, 1); } while (dow(s) !== 0); return s; };
  const pref = (p, s) => (p.prefs && p.prefs[s]) || 'ok';
  const HOURS = { T_HG: 6, T_LILA: 4 };          // alle anderen Schichten: 8 Stunden zzgl. 30 Minuten Pause
  const hours = s => HOURS[s] ?? 8;

  // Gesetzliche Feiertage in Nordrhein-Westfalen
  function easter(y) {
    const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25),
      g = Math.floor((b - f + 1) / 3), h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4,
      l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451), n = h + l - 7 * m + 114;
    return `${y}-${String(Math.floor(n / 31)).padStart(2, '0')}-${String(n % 31 + 1).padStart(2, '0')}`;
  }
  const holCache = {};
  function holidays(y) {
    if (holCache[y]) return holCache[y];
    const e = easter(y), h = {};
    h[y + '-01-01'] = 'Neujahr'; h[addDays(e, -2)] = 'Karfreitag'; h[addDays(e, 1)] = 'Ostermontag';
    h[y + '-05-01'] = 'Tag der Arbeit'; h[addDays(e, 39)] = 'Christi Himmelfahrt'; h[addDays(e, 50)] = 'Pfingstmontag';
    h[addDays(e, 60)] = 'Fronleichnam'; h[y + '-10-03'] = 'Tag der Deutschen Einheit'; h[y + '-11-01'] = 'Allerheiligen';
    h[y + '-12-25'] = '1. Weihnachtstag'; h[y + '-12-26'] = '2. Weihnachtstag';
    return holCache[y] = h;
  }
  const holiday = d => holidays(+d.slice(0, 4))[d];

  function indexEntries(state) {
    const by = {}, marks = state.marks || {};
    for (const e of state.entries || []) (by[e.pid] = by[e.pid] || []).push(e);
    const on = (pid, date) => (by[pid] || []).filter(e => e.from <= date && date <= e.to);
    return {
      hard: (pid, date) => !!(marks[pid] && marks[pid][date]) || on(pid, date).some(e => e.type === 'abwesend'),
      soft: (pid, date) => on(pid, date).some(e => e.type === 'frei'),
      wishes: (pid, date) => on(pid, date).filter(e => e.type === 'schicht' || e.type === 'nicht'),
    };
  }
  const wishCost = (E, pid, date, s) => {
    let c = 0;
    for (const w of E.wishes(pid, date)) {
      if (w.type === 'schicht' && w.shift !== s) c += 25;
      if (w.type === 'nicht' && w.shift === s) c += 25;
    }
    return c;
  };

  // Bewertung der Besetzung eines Werktags. c = Anzahl Techniker je Schicht (Reihenfolge ROT).
  function dayCost(c, fixedTag) {
    let v = 0; const tag = c[1] + fixedTag;
    if (c[0] === 0) v += 1000; else if (c[0] >= 2) v -= 50;
    if (c[0] > 2) v += 5 * (c[0] - 2);
    if (c[3] === 0) v += 1000; else if (c[3] >= 2) v -= 10;
    if (c[4] === 0) v += 1000; else if (c[4] > 1) v += 300 * (c[4] - 1);
    if (tag === 0) v += 300; else if (tag >= 2) v -= 30;
    if (tag > 2) v += 5 * (tag - 2);
    if (c[2] >= 1) v -= 20;
    if (c[2] > 1) v += 5 * (c[2] - 1);
    return v;
  }

  function generate(state) {
    const people = state.people;
    const days = []; for (let i = 0; i < state.weeks * 7; i++) days.push(addDays(state.start, i));
    const E = indexEntries(state);
    const plan = {}; people.forEach(p => plan[p.id] = {});
    const notes = [];
    // Variante: Startwert 0 ergibt den Grundplan, jeder andere mischt Gleichstände anders
    let seed = state.seed | 0;
    const rnd = () => { if (!state.seed) return 0; seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const techsAll = people.filter(p => p.group === 'tech');
    const order = techsAll.map((t, i) => ({ t, k: i + rnd() * 1000 })).sort((a, b) => a.k - b.k);
    const techs = state.seed ? order.map(x => x.t) : techsAll;
    const aush = people.filter(p => p.group === 'aushilfe');
    const fixed = people.filter(p => p.group === 'fixed');
    const isOff = (p, d) => E.hard(p.id, d) || E.soft(p.id, d);
    const countDay = d => { const c = {}; for (const p of people) { const s = plan[p.id][d]; if (s) c[s] = (c[s] || 0) + 1; } return c; };

    // 1. Feste Muster
    for (const p of fixed) for (const d of days)
      if ((p.fixedDays || []).includes(dow(d)) && !isOff(p, d)) plan[p.id][d] = p.fixedShift;

    // 2. Wochenenddienst: zwei Techniker je Wochenende, eine Aushilfe je Tag
    const weDays = {}, lastDuty = {}, weShift = {}, ahCount = {}; const comp = new Set();
    techs.forEach(t => { weDays[t.id] = 0; weShift[t.id] = { FRUEH: 0, SP2: 0, NS: 0 }; });
    aush.forEach(a => ahCount[a.id] = 0);
    for (let w = 0; w < state.weeks; w++) {
      const sat = days[w * 7 + 5], sun = days[w * 7 + 6];
      const duty = techs.map((t, i) => {
        if (E.hard(t.id, sat) || E.hard(t.id, sun)) return null;
        let c = weDays[t.id] * 10;
        if (lastDuty[t.id] === w - 1) c += 1000;
        if (E.soft(t.id, sat) || E.soft(t.id, sun)) c += 15;
        return { t, c, last: lastDuty[t.id] ?? -1, i };
      }).filter(Boolean).sort((a, b) => a.c - b.c || a.last - b.last || a.i - b.i).slice(0, 2).map(x => x.t);

      const cost = (t, s) => {
        const pr = pref(t, s);
        return (pr === 'nie' ? 1e6 : pr === 'ungern' ? 40 : 0) + 5 * weShift[t.id][s]
          + wishCost(E, t.id, sat, s) + wishCost(E, t.id, sun, s);
      };
      let best = null;
      if (duty.length === 2) {
        for (const a of WE) for (const b of WE) if (a !== b) {
          const c = cost(duty[0], a) + cost(duty[1], b);
          if (!best || c < best.c) best = { c, pick: [a, b] };
        }
      } else if (duty.length === 1) {
        for (const a of WE) { const c = cost(duty[0], a); if (!best || c < best.c) best = { c, pick: [a] }; }
      }
      const taken = new Set();
      duty.forEach((t, k) => {
        const s = best.pick[k]; taken.add(s);
        plan[t.id][sat] = s; plan[t.id][sun] = s;
        weShift[t.id][s]++; weDays[t.id] += 2; lastDuty[t.id] = w;
        comp.add(t.id + '|' + days[w * 7 + 4]);                         // Freitag davor frei
        if (days[w * 7 + 11]) comp.add(t.id + '|' + days[w * 7 + 11]);  // Freitag danach frei: höchstens 6 Tage am Stück
      });
      const satPick = {};
      for (const d of [sat, sun]) {
        const used = new Set();
        for (const s of WE) {
          if (taken.has(s)) continue;
          const pick = aush.filter(a => !isOff(a, d) && !used.has(a.id) && pref(a, s) !== 'nie')
            .map((a, i) => ({ a, i, c: ahCount[a.id] * 10 - (satPick[s] === a.id ? 15 : 0) + (pref(a, s) === 'ungern' ? 40 : 0) }))
            .sort((x, y) => x.c - y.c || x.i - y.i)[0];
          if (pick) { plan[pick.a.id][d] = s; ahCount[pick.a.id]++; used.add(pick.a.id); if (d === sat) satPick[s] = pick.a.id; }
        }
      }
    }

    // 3. Werktage: jeder Techniker bekommt je Woche eine Schicht; alle Kombinationen werden bewertet
    const hist = {}; techs.forEach(t => { hist[t.id] = {}; ROT.forEach(s => hist[t.id][s] = 0); });
    for (let w = 0; w < state.weeks; w++) {
      const wd = days.slice(w * 7, w * 7 + 5);
      const act = techs.map(t => ({ t, pres: wd.map(d => !isOff(t, d) && !comp.has(t.id + '|' + d)) }))
        .filter(x => x.pres.some(Boolean));
      if (!act.length) continue;
      const fixedTag = wd.map(d => fixed.filter(f => plan[f.id][d] === 'TAG').length);
      for (const x of act) {
        const weS = plan[x.t.id][days[w * 7 + 5]];
        x.cost = ROT.map(s => {
          const pr = pref(x.t, s);
          let c = (pr === 'nie' ? 1e5 : pr === 'ungern' ? 40 : 0) + 6 * hist[x.t.id][s] + rnd() * 4;
          wd.forEach((d, k) => { if (x.pres[k]) c += wishCost(E, x.t.id, d, s); });
          if (weS === s) c -= 5;
          // Nach Wochenenddienst geht es ohne freien Tag weiter: kein Wechsel rückwärts am Montag
          const sun = w > 0 && plan[x.t.id][days[w * 7 - 1]];
          if (sun && x.pres[0] && SHIFTS[sun].idx > SHIFTS[s].idx) c += 400;
          return c;
        });
      }
      const cnt = wd.map(() => [0, 0, 0, 0, 0]);
      const cur = new Array(act.length); let best = Infinity, bestA = null;
      const rec = (i, acc) => {
        if (i === act.length) {
          let v = acc; for (let k = 0; k < 5; k++) v += dayCost(cnt[k], fixedTag[k]);
          if (v < best) { best = v; bestA = cur.slice(); }
          return;
        }
        const x = act[i];
        for (let si = 0; si < 5; si++) {
          cur[i] = si;
          for (let k = 0; k < 5; k++) if (x.pres[k]) cnt[k][si]++;
          rec(i + 1, acc + x.cost[si]);
          for (let k = 0; k < 5; k++) if (x.pres[k]) cnt[k][si]--;
        }
      };
      rec(0, 0);
      act.forEach((x, i) => {
        const s = ROT[bestA[i]]; hist[x.t.id][s]++;
        wd.forEach((d, k) => { if (x.pres[k]) plan[x.t.id][d] = s; });
      });
    }

    // 4. Lücken an einzelnen Werktagen schließen
    for (let i = 0; i < days.length; i++) {
      const d = days[i]; if (dow(d) > 4) continue;
      for (const S of ['NS', 'FRUEH', 'SP2', 'TAG']) {
        const cnt = countDay(d);
        if (cnt[S]) continue;
        const cand = techs.map((t, ti) => {
          const c = plan[t.id][d];
          if (!c || c === S || pref(t, S) === 'nie') return null;
          let lost;
          if (c === 'SP1') lost = 20;
          else if (c === 'TAG') { if (cnt.TAG >= 2) lost = 30; else if (S !== 'TAG') lost = 300; else return null; }
          else if (cnt[c] >= 2) lost = c === 'FRUEH' ? 50 : 10;
          else return null;
          const prev = i > 0 && plan[t.id][days[i - 1]], next = plan[t.id][days[i + 1]];
          if (prev && SHIFTS[prev].idx > SHIFTS[S].idx) lost += 100;
          if (next && SHIFTS[next].idx < SHIFTS[S].idx) lost += 100;
          if (pref(t, S) === 'ungern') lost += 40;
          return { t, lost, ti };
        }).filter(Boolean).sort((a, b) => a.lost - b.lost || a.ti - b.ti)[0];
        if (cand) {
          plan[cand.t.id][d] = S;
          notes.push({ level: 'info', date: d, pid: cand.t.id, text: `wechselt für diesen Tag auf ${SHIFTS[S].label}, weil die Schicht sonst unbesetzt wäre` });
        } else if (S !== 'TAG') {
          const back = a => {   // Rückwärtswechsel zu den Nachbartagen vermeiden
            const prev = i > 0 && plan[a.id][days[i - 1]], next = plan[a.id][days[i + 1]];
            return (prev && SHIFTS[prev].idx > SHIFTS[S].idx ? 100 : 0) + (next && SHIFTS[next].idx < SHIFTS[S].idx ? 100 : 0);
          };
          const a = aush.filter(a => !isOff(a, d) && !plan[a.id][d] && pref(a, S) !== 'nie')
            .map((a, k) => ({ a, k, c: ahCount[a.id] * 10 + back(a) + (pref(a, S) === 'ungern' ? 40 : 0) }))
            .sort((x, y) => x.c - y.c || x.k - y.k).map(x => x.a)[0];
          if (a) {
            plan[a.id][d] = S; ahCount[a.id]++;
            notes.push({ level: 'info', date: d, pid: a.id, text: `springt als Aushilfe für ${SHIFTS[S].label} ein` });
          }
        }
      }
    }

    const name = Object.fromEntries(people.map(p => [p.id, p.name]));
    notes.forEach(n => n.text = `${name[n.pid]}: ${n.text}`);
    return { days, plan, warnings: validate(state, days, plan).concat(notes), stats: stats(state, days, plan, E) };
  }

  const daysOf = state => { const d = []; for (let i = 0; i < state.weeks * 7; i++) d.push(addDays(state.start, i)); return d; };

  // Prüft einen vorhandenen (auch von Hand geänderten) Plan
  function evaluate(state, plan) {
    const days = daysOf(state);
    state.people.forEach(p => plan[p.id] = plan[p.id] || {});
    return { days, plan, warnings: validate(state, days, plan), stats: stats(state, days, plan, indexEntries(state)) };
  }

  // Schlägt für einen vorhandenen Plan die kleinste Änderung vor, die alle Lücken schließt.
  // Der übrige Plan bleibt unverändert.
  function proposeFix(state, planIn) {
    const days = daysOf(state), E = indexEntries(state), people = state.people;
    const plan = {}; people.forEach(p => plan[p.id] = Object.assign({}, planIn[p.id]));
    const changes = [], open = [];
    const set = (p, d, to) => { changes.push({ pid: p.id, date: d, from: plan[p.id][d] || null, to }); if (to) plan[p.id][d] = to; else delete plan[p.id][d]; };
    const count = d => { const c = {}; for (const p of people) { const s = plan[p.id][d]; if (s) c[s] = (c[s] || 0) + 1; } return c; };
    const total = p => Object.keys(plan[p.id]).length;
    const runWith = (p, i) => {
      let n = 1;
      for (let k = i - 1; k >= 0 && plan[p.id][days[k]]; k--) n++;
      for (let k = i + 1; k < days.length && plan[p.id][days[k]]; k++) n++;
      return n;
    };
    // 1. Wer abwesend ist, wird ausgetragen
    for (const p of people) for (const d of days) if (plan[p.id][d] && E.hard(p.id, d)) set(p, d, null);
    // 2. Jede Lücke mit der naheliegendsten Person schließen
    days.forEach((d, i) => {
      const we = dow(d) > 4;
      for (const S of we ? ['NS', 'FRUEH', 'SP2'] : ['NS', 'FRUEH', 'SP2', 'TAG']) {
        const cnt = count(d); if (cnt[S]) continue;
        let best = null;
        for (const p of people) {
          if (E.hard(p.id, d) || pref(p, S) === 'nie') continue;
          const cur = plan[p.id][d]; let c;
          if (cur) {                                   // wechselt am selben Tag die Schicht
            if (cur === S || SHIFTS[cur].fixedOnly) continue;
            const sole = cnt[cur] === 1;
            if (sole && WE.includes(cur)) continue;    // würde eine andere Pflichtschicht aufreißen
            if (S === 'TAG' && cur === 'TAG') continue;
            c = 10 * Math.abs(SHIFTS[cur].idx - SHIFTS[S].idx)      // benachbarte Schicht zuerst
              + (cur === 'TAG' && sole ? 120 : 0)                   // Tagschicht entfällt nur im Notfall
              + (p.group === 'fixed' ? 40 : 0);
          } else {                                     // springt an einem freien Tag ein
            if (S === 'TAG' || p.group === 'fixed' || runWith(p, i) > 6) continue;
            c = p.group === 'aushilfe' ? 60 + 3 * total(p) : 150;
          }
          const prev = i > 0 && plan[p.id][days[i - 1]], next = plan[p.id][days[i + 1]];
          if (prev && SHIFTS[prev].idx > SHIFTS[S].idx) c += prev === 'NS' ? 200 : 25;
          if (next && SHIFTS[next].idx < SHIFTS[S].idx) c += S === 'NS' ? 200 : 25;
          if (pref(p, S) === 'ungern') c += 40;
          if (E.soft(p.id, d)) c += 60;
          if (!best || c < best.c) best = { p, c };
        }
        if (best) set(best.p, d, S); else if (S !== 'TAG') open.push({ date: d, shift: S });
      }
    });
    return { changes, open, plan };
  }

  function validate(state, days, plan) {
    const E = indexEntries(state); const out = []; const maxRun = 6;
    const name = Object.fromEntries(state.people.map(p => [p.id, p.name]));
    const add = (level, date, pid, text) => out.push({ level, date, pid, text });
    for (const d of days) {
      const c = {}; let techWe = 0;
      for (const p of state.people) { const s = plan[p.id][d]; if (s) { c[s] = (c[s] || 0) + 1; if (p.group === 'tech') techWe++; } }
      const we = dow(d) > 4;
      for (const s of WE) if (!c[s]) add('error', d, null, `${SHIFTS[s].label} ist nicht besetzt`);
      if (!we && !c.TAG) add('warn', d, null, 'Tagschicht ist nicht besetzt');
      if (c.NS > 1) add('warn', d, null, 'Nachtschicht ist doppelt besetzt');
      if (we && techWe !== 2) add('warn', d, null, `${techWe} statt 2 Techniker im Wochenenddienst`);
    }
    for (const p of state.people) {
      let run = 0;
      days.forEach((d, i) => {
        const s = plan[p.id][d];
        if (!s) { run = 0; if (E.wishes(p.id, d).some(w => w.type === 'schicht')) add('info', d, p.id, 'Schichtwunsch nicht erfüllt (frei)'); return; }
        run++;
        if (run === maxRun + 1) add('error', d, p.id, `mehr als ${maxRun} Tage am Stück`);
        if (E.hard(p.id, d)) add('error', d, p.id, 'ist abwesend, aber eingeteilt');
        else if (E.soft(p.id, d)) add('info', d, p.id, 'Wunsch „frei“ nicht erfüllt');
        if (pref(p, s) === 'nie') add('error', d, p.id, `darf ${SHIFTS[s].label} nicht übernehmen`);
        for (const w of E.wishes(p.id, d)) {
          if (w.type === 'schicht' && w.shift !== s) add('info', d, p.id, `Wunsch ${SHIFTS[w.shift].label} nicht erfüllt`);
          if (w.type === 'nicht' && w.shift === s) add('info', d, p.id, `Wunsch „nicht ${SHIFTS[s].label}“ nicht erfüllt`);
        }
        const prev = i > 0 && plan[p.id][days[i - 1]];
        if (prev && SHIFTS[prev].idx > SHIFTS[s].idx)
          add('warn', d, p.id, `Wechsel rückwärts (${SHIFTS[prev].label} → ${SHIFTS[s].label})`);
      });
    }
    out.forEach(o => { if (o.pid) o.text = `${name[o.pid]}: ${o.text}`; });
    return out;
  }

  function stats(state, days, plan, E) {
    return state.people.map(p => {
      const r = { pid: p.id, name: p.name, group: p.group, total: 0, weekend: 0, by: {}, wishes: 0, met: 0, soll: 0, ist: 0, months: {} };
      for (const d of days) {
        const s = plan[p.id][d];
        const m = r.months[d.slice(0, 7)] = r.months[d.slice(0, 7)] || { soll: 0, ist: 0 };
        if (s) { r.total++; r.by[s] = (r.by[s] || 0) + 1; if (dow(d) > 4) r.weekend++; r.ist += hours(s); m.ist += hours(s); }
        // Soll: 8 Stunden je Werktag Montag bis Freitag, ohne Feiertage und ohne Abwesenheit
        if (dow(d) < 5 && !holiday(d) && !E.hard(p.id, d)) { r.soll += 8; m.soll += 8; }
        if (E.soft(p.id, d)) { r.wishes++; if (!s) r.met++; }
        for (const w of E.wishes(p.id, d)) {
          r.wishes++;
          if (w.type === 'schicht' ? s === w.shift : s !== w.shift) r.met++;
        }
      }
      return r;
    });
  }

  function defaultState(today = new Date()) {
    const people = [];
    const tech = (n, prefs) => people.push({ id: 't' + n, name: 'Techniker ' + n, group: 'tech', prefs: prefs || {} });
    tech(1, { TAG: 'nie', SP1: 'nie', SP2: 'nie' });   // nur Früh und Nacht
    tech(2, { NS: 'nie' });                            // keine Nachtschicht
    tech(3); tech(4); tech(5); tech(6);
    people.push({ id: 'f1', name: 'Tagschicht (fest)', group: 'fixed', fixedShift: 'TAG', fixedDays: [0, 1, 2, 3, 4] });
    people.push({ id: 'f2', name: 'T 09:00–15:00', group: 'fixed', fixedShift: 'T_HG', fixedDays: [0, 1, 2, 3, 4] });
    people.push({ id: 'f3', name: 'T 08:00–12:00', group: 'fixed', fixedShift: 'T_LILA', fixedDays: [3] });
    for (let i = 1; i <= 6; i++) people.push({ id: 'a' + i, name: 'Aushilfe ' + i, group: 'aushilfe', prefs: {} });
    return { start: nextMonday(today), weeks: 13, seed: 0, people, entries: [], marks: {} };
  }

  return { SHIFTS, ROT, WE, DOW, generate, evaluate, proposeFix, defaultState, addDays, dow, nextMonday, holiday, easter };
})();
if (typeof module !== 'undefined') module.exports = Planner;
</script>

<script>
(() => {
  const { SHIFTS, ROT, DOW } = Planner;
  const KEY = 'schichtplan.v1';
  const $ = s => document.querySelector(s);
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const GROUPS = { tech: 'Feste Techniker', fixed: 'Mitlaufende', aushilfe: 'Aushilfen' };
  const TYPES = { abwesend: 'Abwesend (Urlaub, krank)', frei: 'Wunsch: frei', schicht: 'Wunsch: diese Schicht', nicht: 'Wunsch: nicht diese Schicht' };
  const MARKS = { K: 'Krank', U: 'Urlaub' };
  const MONTHS = ['Januar', 'Februar', 'März', 'April', 'Mai', 'Juni', 'Juli', 'August', 'September', 'Oktober', 'November', 'Dezember'];
  const deDate = d => d.slice(8) + '.' + d.slice(5, 7) + '.';
  const dayLabel = d => DOW[Planner.dow(d)] + ' ' + deDate(d);
  const sl = s => s ? SHIFTS[s].label : 'frei';

  let state, result, tab = 'plan', proposal = null, dirty = false;
  try { state = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
  if (!state || !state.people) state = Planner.defaultState();
  state.marks = state.marks || {}; delete state.overrides;
  const newPlan = () => { state.plan = Planner.generate(state).plan; proposal = null; dirty = false; };
  if (!state.plan) newPlan();
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };
  const update = () => { save(); result = Planner.evaluate(state, state.plan); render(); };
  const edited = () => { proposal = null; dirty = true; update(); };

  function render() {
    $('#start').value = state.start; $('#weeks').value = state.weeks;
    $('#tabs').innerHTML = [['plan', 'Plan'], ['people', 'Personen'], ['entries', 'Wünsche und Abwesenheiten'], ['stats', 'Auswertung']]
      .map(([k, l]) => `<button data-tab="${k}" class="${k === tab ? 'on' : ''}">${l}</button>`).join('');
    $('#view').innerHTML = { plan: viewPlan, people: viewPeople, entries: viewEntries, stats: viewStats }[tab]();
    $('#pop').style.display = 'none';
  }

  function viewProposal() {
    if (!proposal) return '';
    const name = Object.fromEntries(state.people.map(p => [p.id, p.name]));
    const { changes, open } = proposal;
    if (!changes.length && !open.length)
      return '<div class="proposal"><strong>Keine Änderung nötig.</strong> Alle Pflichtschichten sind besetzt.<div class="row" style="margin-top:8px"><button id="reject">Schließen</button></div></div>';
    let h = '<div class="proposal"><strong>Vorschlag</strong> (im Plan blau umrandet)<ul>';
    for (const c of changes)
      h += `<li>${dayLabel(c.date)} · ${esc(name[c.pid])}: ` + (c.to
        ? (c.from ? `wechselt von ${sl(c.from)} auf ${sl(c.to)}` : `springt für ${sl(c.to)} ein`)
        : `wird aus ${sl(c.from)} ausgetragen (abwesend)`) + '</li>';
    for (const o of open) h += `<li class="open">${dayLabel(o.date)} · ${sl(o.shift)}: kein Ersatz gefunden</li>`;
    return h + '</ul><div class="row">' + (changes.length ? '<button class="primary" id="accept">Vorschlag übernehmen</button>' : '') + '<button id="reject">Verwerfen</button></div></div>';
  }

  function viewPlan() {
    const { days, warnings } = result;
    const plan = proposal ? proposal.plan : state.plan;
    const prop = {}; if (proposal) for (const c of proposal.changes) prop[c.pid + '|' + c.date] = 1;
    const n = l => warnings.filter(w => w.level === l).length;
    const dayErr = {}; const cellBad = {};
    for (const w of warnings) if (w.level === 'error') { if (w.pid) cellBad[w.pid + '|' + w.date] = 1; else dayErr[w.date] = 1; }
    const E = {}; for (const e of state.entries) for (const d of days) if (e.from <= d && d <= e.to) E[e.pid + '|' + d] = e.type === 'abwesend' ? 'off' : (E[e.pid + '|' + d] || 'wish');
    const cls = d => (Planner.dow(d) > 4 ? ' we' : '') + (Planner.holiday(d) ? ' hol' : '') + (d.slice(8) === '01' ? ' monthstart' : '');
    let h = viewProposal() + `<div class="summary">
      ${n('error') ? `<span class="pill error">${n('error')} Regelverstöße</span>` : '<span class="pill ok">Alle Pflichtschichten besetzt, keine Regelverstöße</span>'}
      <span class="pill warn">${n('warn')} Warnungen</span><span class="pill info">${n('info')} Hinweise</span>
      ${dirty ? '<span class="pill">Plan geändert: „Aktualisieren“ prüft, ob jemand einspringen muss</span>' : ''}</div>
      <p class="hint">Ein Klick auf ein Feld ändert den Eintrag, zum Beispiel auf „Krank“. „Aktualisieren“ schlägt danach die kleinste nötige Änderung vor und lässt den übrigen Plan unverändert.</p>
      <div class="gridwrap"><table class="grid"><thead><tr><th class="name"></th>`;
    let i = 0;
    while (i < days.length) {
      let j = i; while (j < days.length && days[j].slice(0, 7) === days[i].slice(0, 7)) j++;
      h += `<th colspan="${j - i}" class="monthstart" style="text-align:left;padding-left:6px">${MONTHS[+days[i].slice(5, 7) - 1]} ${days[i].slice(0, 4)}</th>`; i = j;
    }
    h += '</tr><tr><th class="name">Person</th>' + days.map(d => `<th class="${cls(d)}" title="${Planner.holiday(d) || ''}">${DOW[Planner.dow(d)]} ${+d.slice(8)}</th>`).join('') + '</tr></thead><tbody>';
    for (const g of Object.keys(GROUPS)) {
      const ps = state.people.filter(p => p.group === g); if (!ps.length) continue;
      h += `<tr class="group"><th class="name">${GROUPS[g]}</th><td colspan="${days.length}"></td></tr>`;
      for (const p of ps) {
        h += `<tr><th class="name">${esc(p.name)}</th>`;
        for (const d of days) {
          const s = (plan[p.id] || {})[d], k = p.id + '|' + d, m = (state.marks[p.id] || {})[d];
          h += `<td class="cell${cls(d)}${cellBad[k] ? ' bad' : ''}${m ? ' off' : E[k] ? ' ' + E[k] : ''}${prop[k] ? ' prop' : ''}" data-pid="${p.id}" data-date="${d}">`
            + (s ? `<span class="chip s-${s}" title="${SHIFTS[s].time}">${SHIFTS[s].label}</span>` : m ? `<span class="absmark" title="${MARKS[m]}">${m}</span>` : '') + '</td>';
        }
        h += '</tr>';
      }
    }
    h += '<tr class="status"><th class="name">Pflichtschichten</th>' + days.map(d => `<td class="${cls(d)} ${dayErr[d] ? 'st-error' : 'st-ok'}">${dayErr[d] ? '!' : '✓'}</td>`).join('') + '</tr>';
    h += '</tbody></table></div><div class="legend">'
      + Object.entries(SHIFTS).map(([k, s]) => `<span><span class="chip s-${k}">${s.label}</span> ${s.time}</span>`).join('')
      + '<span><span class="swatch"></span> Feiertag (NRW)</span><span>Schraffiert: abwesend (K krank, U Urlaub)</span><span>Punkt: Wunsch eingetragen</span></div>';
    const order = { error: 0, warn: 1, info: 2 }, lab = { error: 'Verstoß', warn: 'Warnung', info: 'Hinweis' };
    const ws = warnings.slice().sort((a, b) => order[a.level] - order[b.level] || a.date.localeCompare(b.date));
    h += '<ul class="warnings">' + ws.map(w => `<li><span class="lv ${w.level}">${lab[w.level]}</span>${dayLabel(w.date)} · ${esc(w.text)}</li>`).join('') + '</ul>';
    return h;
  }

  const shiftOpts = (sel, keys) => keys.map(k => `<option value="${k}"${k === sel ? ' selected' : ''}>${SHIFTS[k].label} ${SHIFTS[k].time}</option>`).join('');

  function viewPeople() {
    let h = `<p class="hint">Die Reihenfolge der Techniker bestimmt, wer zuerst Wochenenddienst hat. „Nie“ ist eine feste Vorgabe, „ungern“ ein Wunsch. Änderungen hier wirken auf die Prüfung sofort und auf die Einteilung, sobald du einen neuen Plan berechnest.</p>
      <div class="scroll"><table class="plain"><tr><th>Name</th><th>Gruppe</th><th>Schichten</th><th></th></tr>`;
    state.people.forEach((p, i) => {
      let mid;
      if (p.group === 'fixed') {
        mid = `<select data-f="fixedShift" data-i="${i}">${shiftOpts(p.fixedShift, Object.keys(SHIFTS))}</select> <span class="days">`
          + [0, 1, 2, 3, 4].map(d => `<label><input type="checkbox" data-f="day" data-d="${d}" data-i="${i}"${(p.fixedDays || []).includes(d) ? ' checked' : ''}>${DOW[d]}</label>`).join('') + '</span>';
      } else {
        mid = ROT.map(s => `<label style="display:inline-flex;margin-right:8px">${SHIFTS[s].label}<select data-f="pref" data-s="${s}" data-i="${i}">`
          + ['ok', 'ungern', 'nie'].map(v => `<option${((p.prefs || {})[s] || 'ok') === v ? ' selected' : ''}>${v}</option>`).join('') + '</select></label>').join('');
      }
      h += `<tr><td><input data-f="name" data-i="${i}" value="${esc(p.name)}"></td>
        <td><select data-f="group" data-i="${i}">${Object.entries(GROUPS).map(([k, l]) => `<option value="${k}"${k === p.group ? ' selected' : ''}>${l}</option>`).join('')}</select></td>
        <td>${mid}</td><td><button class="link" data-del="${i}">Entfernen</button></td></tr>`;
    });
    return h + '</table></div><p><button id="addPerson">Person hinzufügen</button></p>';
  }

  function viewEntries() {
    const name = Object.fromEntries(state.people.map(p => [p.id, p.name]));
    let h = `<p class="hint">Einträge für längere Zeiträume. Einzelne Tage lassen sich auch direkt im Plan anklicken. Danach im Plan auf „Aktualisieren“ klicken.</p><div class="form">
      <label>Person<select id="ePid">${state.people.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></label>
      <label>Art<select id="eType">${Object.entries(TYPES).map(([k, l]) => `<option value="${k}">${l}</option>`).join('')}</select></label>
      <label>Schicht<select id="eShift">${shiftOpts('', ROT)}</select></label>
      <label>Von<input type="date" id="eFrom" value="${state.start}"></label>
      <label>Bis<input type="date" id="eTo" value="${state.start}"></label>
      <button class="primary" id="addEntry">Eintragen</button></div>`;
    if (!state.entries.length) return h + '<p class="hint">Noch keine Wünsche oder Abwesenheiten eingetragen.</p>';
    h += '<div class="scroll"><table class="plain"><tr><th>Person</th><th>Art</th><th>Von</th><th>Bis</th><th></th></tr>';
    state.entries.forEach((e, i) => {
      h += `<tr><td>${esc(name[e.pid] || '?')}</td><td>${TYPES[e.type]}${e.type === 'schicht' || e.type === 'nicht' ? ' (' + SHIFTS[e.shift].label + ')' : ''}</td>
        <td>${deDate(e.from)}${e.from.slice(0, 4)}</td><td>${deDate(e.to)}${e.to.slice(0, 4)}</td><td><button class="link" data-edel="${i}">Entfernen</button></td></tr>`;
    });
    return h + '</table></div>';
  }

  function viewStats() {
    const keys = Object.keys(SHIFTS);
    const months = (state.weeks * 7) / 30.44;
    const ym = [...new Set(result.days.map(d => d.slice(0, 7)))];
    const sign = n => (n > 0 ? '+' : '') + n;
    let h = '<p class="hint">Soll: 8 Stunden je Werktag von Montag bis Freitag, ohne Feiertage in NRW und ohne Abwesenheit. Ist: 8 Stunden je Schicht, Pausen nicht mitgezählt. Angebrochene Monate am Anfang und Ende zählen nur mit den geplanten Tagen.</p>'
      + '<div class="scroll"><table class="plain"><tr><th>Person</th><th>Soll (h)</th><th>Ist (h)</th><th>Saldo (h)</th>'
      + ym.map(m => `<th>${MONTHS[+m.slice(5) - 1].slice(0, 3)}</th>`).join('') + '<th>Wochenendtage</th><th>pro Monat</th></tr>';
    for (const r of result.stats.filter(r => r.group === 'tech'))
      h += `<tr><td>${esc(r.name)}</td><td>${r.soll}</td><td>${r.ist}</td><td class="${r.ist < r.soll ? 'neg' : ''}">${sign(r.ist - r.soll)}</td>`
        + ym.map(m => { const x = r.months[m]; return `<td class="${x.ist < x.soll ? 'neg' : ''}">${sign(x.ist - x.soll)}</td>`; }).join('')
        + `<td>${r.weekend}</td><td>${(r.weekend / months).toFixed(1)}</td></tr>`;
    h += '</table></div><h3>Schichten je Person</h3><div class="scroll"><table class="plain"><tr><th>Person</th><th>Schichten</th>'
      + keys.map(k => `<th><span class="chip s-${k}">${SHIFTS[k].label}</span></th>`).join('') + '<th>Wochenendtage</th><th>Wünsche erfüllt</th></tr>';
    for (const r of result.stats)
      h += `<tr><td>${esc(r.name)}</td><td>${r.total}</td>${keys.map(k => `<td>${r.by[k] || ''}</td>`).join('')}<td>${r.weekend}</td><td>${r.wishes ? r.met + ' von ' + r.wishes : ''}</td></tr>`;
    return h + '</table></div>';
  }

  // Knopf, der erst beim zweiten Klick ausführt (Dialogfenster sind nicht überall erlaubt)
  function twoStep(btn, ask, fn) {
    const label = btn.textContent; let armed = 0;
    const disarm = () => { armed = 0; btn.textContent = label; };
    btn.onclick = () => {
      if (armed && Date.now() - armed < 5000) { disarm(); fn(); return; }
      armed = Date.now(); btn.textContent = ask; setTimeout(() => { if (armed) disarm(); }, 5000);
    };
  }

  // Ereignisse
  $('#tabs').onclick = e => { if (e.target.dataset.tab) { tab = e.target.dataset.tab; render(); } };
  $('#start').onchange = e => {
    if (!e.target.value) return;
    let s = e.target.value; while (Planner.dow(s) !== 0) s = Planner.addDays(s, -1);
    state.start = s; newPlan(); update();
  };
  $('#weeks').onchange = e => { state.weeks = Math.max(1, Math.min(26, +e.target.value || 13)); newPlan(); update(); };
  $('#refresh').onclick = () => { proposal = Planner.proposeFix(state, state.plan); tab = 'plan'; render(); window.scrollTo(0, 0); };
  twoStep($('#variant'), 'Handänderungen gehen verloren. Sicher?', () => { state.seed = 1 + Math.floor(Math.random() * 1e9); newPlan(); tab = 'plan'; update(); });
  twoStep($('#reset'), 'Wirklich alles ersetzen?', () => { state = Planner.defaultState(); newPlan(); update(); });

  $('#view').addEventListener('change', e => {
    const t = e.target, f = t.dataset.f; if (!f) return;
    const p = state.people[+t.dataset.i];
    if (f === 'name') p.name = t.value;
    if (f === 'group') { p.group = t.value; if (p.group === 'fixed') { p.fixedShift = p.fixedShift || 'TAG'; p.fixedDays = p.fixedDays || [0, 1, 2, 3, 4]; } else p.prefs = p.prefs || {}; }
    if (f === 'fixedShift') p.fixedShift = t.value;
    if (f === 'day') { const d = +t.dataset.d; p.fixedDays = (p.fixedDays || []).filter(x => x !== d); if (t.checked) p.fixedDays.push(d); }
    if (f === 'pref') { p.prefs = p.prefs || {}; if (t.value === 'ok') delete p.prefs[t.dataset.s]; else p.prefs[t.dataset.s] = t.value; }
    if (f === 'name') update(); else edited();
  });
  $('#view').addEventListener('click', e => {
    const t = e.target;
    if (t.id === 'accept') { state.plan = proposal.plan; proposal = null; dirty = false; update(); }
    else if (t.id === 'reject') { proposal = null; render(); }
    else if (t.id === 'addPerson') { state.people.push({ id: 'p' + Date.now(), name: 'Neue Person', group: 'aushilfe', prefs: {} }); update(); }
    else if (t.dataset.del) { const p = state.people.splice(+t.dataset.del, 1)[0]; state.entries = state.entries.filter(x => x.pid !== p.id); delete state.plan[p.id]; delete state.marks[p.id]; edited(); }
    else if (t.dataset.edel) { state.entries.splice(+t.dataset.edel, 1); edited(); }
    else if (t.id === 'addEntry') {
      let from = $('#eFrom').value, to = $('#eTo').value; if (!from) return; if (!to || to < from) to = from;
      state.entries.push({ pid: $('#ePid').value, type: $('#eType').value, shift: $('#eShift').value, from, to }); edited();
    } else {
      const cell = t.closest('td.cell'); if (cell) openPop(cell);
    }
  });

  function openPop(cell) {
    const { pid, date } = cell.dataset, pop = $('#pop');
    const p = state.people.find(x => x.id === pid);
    pop.innerHTML = `<div class="t">${esc(p.name)} · ${dayLabel(date)}</div><div class="b">`
      + Object.keys(SHIFTS).map(k => `<button data-v="${k}"><span class="chip s-${k}">${SHIFTS[k].label}</span></button>`).join('')
      + '<button data-v="FREI">Frei</button><button data-v="K">Krank</button><button data-v="U">Urlaub</button></div>';
    const r = cell.getBoundingClientRect();
    pop.style.display = 'block';
    pop.style.left = Math.max(8, Math.min(window.innerWidth - 230, r.left + window.scrollX)) + 'px';
    pop.style.top = (r.bottom + window.scrollY + 4) + 'px';
    pop.onclick = e => {
      const b = e.target.closest('button'); if (!b) return;
      const v = b.dataset.v, row = state.plan[pid] = state.plan[pid] || {}, marks = state.marks[pid] = state.marks[pid] || {};
      delete marks[date]; delete row[date];
      if (MARKS[v]) marks[date] = v; else if (v !== 'FREI') row[date] = v;
      edited();
    };
  }
  document.addEventListener('click', e => { if (!e.target.closest('#pop') && !e.target.closest('td.cell')) $('#pop').style.display = 'none'; });

  update();
})();
</script>
</body>
</html>
